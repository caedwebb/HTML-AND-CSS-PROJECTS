    <head>
        <title>Contact Us</title>
        <meta charset="UTF-8">
        <meta name="description" content="Contact information for The Pet Shop">
        <meta name="keywords" content="contact, pet, store, shop, food, pets, dogs, cats, rabbits, rodents, fish, reptiles">
        <meta name="author" content="Caedmon Webb Design">
        <link rel="stylesheet" href="css/style.css">

    <body>
        <!--NAVBAR-->
        <nav class="nav-bar">

                <li><a href="index.html">HOME</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </nav>
        <!--HEADER-->
        <header>
            <div>
                <h1 class="animate-text">Contact Us!</h1>
            </div>
        <section>
            <div>
                <h3 id="contact-h3">Please provide your contact information
                    and a brief message of your inquiry.
                </h3>
            </div>
                <form>  
                    <input type="text" placeholder="First Name">
                    <input type="text" placeholder="Last Name"><br>
                    <input type="email" placeholder="Email">
                    <input type="tel" placeholder="Phone number"><br>
                    <input type="checkbox" id="newsletter">
                    <label for="newsletter">Would you like to receive our monthly newsletter?</label><br>
                    <textarea placeholder="Type message here..."></textarea><br>
                    <input type="submit" value="Submit">
                </form>
        </section>
        
        </header>
        <!--FOOTER-->
        <footer>
            <table>
                <tr>
                    <td>
                        <p>The Pet Shop! &copy;</p>
                    </td>

                    </td>
                    <td>
                        <p>503-234-3966</p>
                    </td>
                </tr>
            </table>
        </footer>
