<!DOCTYPE html>
<html>
    <head>
        <title>Creating Effects with CSS</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <!--NAVBAR-->
        <nav class="nav-bar">
            <ul>
                <li>
                    <a href="#">Home</a>
                </li>
                <li class="drop">
                    <a href="#">Images</a>
                    <div class="rollover-menu">
                        <a href="#image1">Image 1</a>
                        <a href="#image2">Image 2</a>
                        <a href="#image3">Image 3</a>
                    </div>
                </li>
            </ul>
        </nav>
        <!--IMAGES-->
        <section>
            <!--IMAGE 1-->
            <div class="image-container" id="image1">
                <img src="images/cat.jpg">
                <div class="overlay"></div>
            </div>
            <div class="picture-caption">
                <p>Cat picture!</p>
            </div>
            <!--IMAGE 2-->
            <div class="image-container" id="image2">
                <img src="images/dog.jpg" class="zoom">
            </div>
            <div class="picture-caption">
                <p>Dog picture!</p>
            </div>
            <!--IMAGE 3-->
            <div class="image-container" id="image3">
                <div class="circle">
                    <img src="images/fish.jpg">
                </div>
            </div>
            <div class="picture-caption">
                <p>Fish picture!</p>
            </div>
        </section>
        <!--FOOTER--> 
        <footer>
            <div class="footer-text">
                <p>The Tech Academy &copy;</p>
            </div>
        </footer>
    </body>
</html>
